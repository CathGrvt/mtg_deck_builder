name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ui.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Vulture dead code check
        run: |
          vulture \
            mtg_shared \
            gcp_agent_runtime \
            research_pipeline \
            mtg_ui_app \
            ai_deck_generator.py \
            archidekt_deck_list_scraper.py \
            current_standard_deck_list_scraper.py \
            deck_analysis.py \
            deck_corpus_builder.py \
            deploy_agent_engine.py \
            fetch_standard_legal_cards.py \
            mtg_io.py \
            run_backend_adapter.py \
            run_research_eval.py \
            run_research_pipeline.py \
            sync_rag_corpus.py \
            train_deck_generator.py \
            ui_helpers.py \
            tests/vulture_whitelist.py \
            --min-confidence 100

      - name: Run tests
        run: PYTHONPATH=. pytest -q
