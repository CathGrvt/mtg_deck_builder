name: Deploy GCP

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Deploy Cloud Run backend adapter"
        type: boolean
        default: true
      deploy_ui:
        description: "Deploy Cloud Run Streamlit UI"
        type: boolean
        default: true
      deploy_agent_engine:
        description: "Deploy ADK app to Vertex AI Agent Engine"
        type: boolean
        default: false
      agent_display_name:
        description: "Agent Engine display name"
        type: string
        default: "mtg-deck-builder-agent"
      langsmith_fanout:
        description: "Enable LANGSMITH OTEL env vars for Agent Engine deploy"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}
      ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO || secrets.GCP_ARTIFACT_REPO || 'mtg' }}
      STAGING_BUCKET: ${{ vars.GCP_STAGING_BUCKET || secrets.GCP_STAGING_BUCKET }}
      BACKEND_SERVICE: ${{ vars.GCP_BACKEND_SERVICE || secrets.GCP_BACKEND_SERVICE || 'mtg-backend' }}
      UI_SERVICE: ${{ vars.GCP_UI_SERVICE || secrets.GCP_UI_SERVICE || 'mtg-ui' }}
      BACKEND_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_BACKEND_RUNTIME_SERVICE_ACCOUNT || secrets.GCP_BACKEND_RUNTIME_SERVICE_ACCOUNT || '' }}
      UI_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_UI_RUNTIME_SERVICE_ACCOUNT || secrets.GCP_UI_RUNTIME_SERVICE_ACCOUNT || '' }}
      MTG_BACKEND_MODE: ${{ vars.MTG_BACKEND_MODE || secrets.MTG_BACKEND_MODE || 'local' }}
      MTG_LLM_PROVIDER: ${{ vars.MTG_LLM_PROVIDER || secrets.MTG_LLM_PROVIDER || 'openai' }}
      MTG_OPENAI_MODEL: ${{ vars.MTG_OPENAI_MODEL || secrets.MTG_OPENAI_MODEL || 'gpt-4o-mini' }}
      MTG_OPENAI_API_KEY_ENV: ${{ vars.MTG_OPENAI_API_KEY_ENV || secrets.MTG_OPENAI_API_KEY_ENV || 'OPENAI_API_KEY' }}
      MTG_OPENAI_API_KEY_SECRET_RESOURCE: ${{ vars.MTG_OPENAI_API_KEY_SECRET_RESOURCE || secrets.MTG_OPENAI_API_KEY_SECRET_RESOURCE || '' }}
      MTG_OPENAI_API_KEY_SECRET: ${{ vars.MTG_OPENAI_API_KEY_SECRET || secrets.MTG_OPENAI_API_KEY_SECRET || '' }}
      MTG_OPENAI_BASE_URL: ${{ vars.MTG_OPENAI_BASE_URL || secrets.MTG_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      MTG_VERTEX_MODEL: ${{ vars.MTG_VERTEX_MODEL || secrets.MTG_VERTEX_MODEL || 'gemini-2.5-flash' }}
      MTG_LLM_TIMEOUT_SEC: ${{ vars.MTG_LLM_TIMEOUT_SEC || secrets.MTG_LLM_TIMEOUT_SEC || '45' }}
      MTG_VERTEX_PROXY_RESEARCH: ${{ vars.MTG_VERTEX_PROXY_RESEARCH || secrets.MTG_VERTEX_PROXY_RESEARCH || 'false' }}
      MTG_VERTEX_PROXY_CHAT: ${{ vars.MTG_VERTEX_PROXY_CHAT || secrets.MTG_VERTEX_PROXY_CHAT || 'false' }}
      MTG_VERTEX_FALLBACK_TO_LOCAL: ${{ vars.MTG_VERTEX_FALLBACK_TO_LOCAL || secrets.MTG_VERTEX_FALLBACK_TO_LOCAL || 'true' }}
      MTG_VERTEX_AGENT_ENGINE_RESOURCE: ${{ vars.MTG_VERTEX_AGENT_ENGINE_RESOURCE || secrets.MTG_VERTEX_AGENT_ENGINE_RESOURCE || '' }}
      MTG_VERTEX_AGENT_ENGINE_TIMEOUT_SEC: ${{ vars.MTG_VERTEX_AGENT_ENGINE_TIMEOUT_SEC || secrets.MTG_VERTEX_AGENT_ENGINE_TIMEOUT_SEC || '60' }}
      MTG_CHAT_ENABLE_CLARIFICATION: ${{ vars.MTG_CHAT_ENABLE_CLARIFICATION || secrets.MTG_CHAT_ENABLE_CLARIFICATION || 'true' }}
      MTG_CHAT_MAX_CLARIFICATION_TURNS: ${{ vars.MTG_CHAT_MAX_CLARIFICATION_TURNS || secrets.MTG_CHAT_MAX_CLARIFICATION_TURNS || '1' }}
      MTG_RAG_CORPUS_URI: ${{ vars.MTG_RAG_CORPUS_URI || secrets.MTG_RAG_CORPUS_URI || '' }}
      MTG_LOCAL_RETRIEVER_CARDS_CSV: ${{ vars.MTG_LOCAL_RETRIEVER_CARDS_CSV || secrets.MTG_LOCAL_RETRIEVER_CARDS_CSV || '' }}
      MTG_LOCAL_RETRIEVER_DECKS_DIR: ${{ vars.MTG_LOCAL_RETRIEVER_DECKS_DIR || secrets.MTG_LOCAL_RETRIEVER_DECKS_DIR || '' }}
      MTG_LOCAL_RETRIEVER_META_JSON_PATHS: ${{ vars.MTG_LOCAL_RETRIEVER_META_JSON_PATHS || secrets.MTG_LOCAL_RETRIEVER_META_JSON_PATHS || '' }}
      MTG_LOCAL_RETRIEVER_ENABLE_SEMANTIC: ${{ vars.MTG_LOCAL_RETRIEVER_ENABLE_SEMANTIC || secrets.MTG_LOCAL_RETRIEVER_ENABLE_SEMANTIC || '' }}
      MTG_LOCAL_RETRIEVER_LEXICAL_WEIGHT: ${{ vars.MTG_LOCAL_RETRIEVER_LEXICAL_WEIGHT || secrets.MTG_LOCAL_RETRIEVER_LEXICAL_WEIGHT || '' }}
      MTG_LOCAL_RETRIEVER_SEMANTIC_WEIGHT: ${{ vars.MTG_LOCAL_RETRIEVER_SEMANTIC_WEIGHT || secrets.MTG_LOCAL_RETRIEVER_SEMANTIC_WEIGHT || '' }}
      LANGSMITH_API_KEY_SECRET_RESOURCE: ${{ vars.LANGSMITH_API_KEY_SECRET_RESOURCE || secrets.LANGSMITH_API_KEY_SECRET_RESOURCE || '' }}
      LANGSMITH_API_KEY_SECRET: ${{ vars.LANGSMITH_API_KEY_SECRET || secrets.LANGSMITH_API_KEY_SECRET || '' }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || secrets.GOOGLE_CLOUD_PROJECT || vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || secrets.GOOGLE_CLOUD_LOCATION || vars.GCP_REGION || secrets.GCP_REGION || 'us-central1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Validate required settings
        run: |
          test -n "${PROJECT_ID}" || (echo "Missing repo variable GCP_PROJECT_ID" && exit 1)
          test -n "${REGION}" || (echo "Missing region" && exit 1)

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${ARTIFACT_REPO}" \
            --location="${REGION}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${ARTIFACT_REPO}" \
            --location="${REGION}" \
            --repository-format=docker \
            --description="MTG Deck Builder container images"

      - name: Build and deploy backend adapter
        if: ${{ inputs.deploy_backend }}
        run: |
          BACKEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/mtg-backend:${GITHUB_SHA}"
          BACKEND_ENV_VARS="$(python3 scripts/render_runtime_env.py --target backend)"
          BACKEND_SA_ARG=()
          if [ -n "${BACKEND_RUNTIME_SERVICE_ACCOUNT}" ]; then
            BACKEND_SA_ARG=(--service-account "${BACKEND_RUNTIME_SERVICE_ACCOUNT}")
          fi
          gcloud builds submit \
            --tag "${BACKEND_IMAGE}" \
            -f Dockerfile.backend \
            .

          gcloud run deploy "${BACKEND_SERVICE}" \
            --region "${REGION}" \
            --image "${BACKEND_IMAGE}" \
            --allow-unauthenticated \
            "${BACKEND_SA_ARG[@]}" \
            --set-env-vars "PORT=8080,${BACKEND_ENV_VARS}"

      - name: Build and deploy Streamlit UI
        if: ${{ inputs.deploy_ui }}
        run: |
          UI_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/mtg-ui:${GITHUB_SHA}"
          UI_SA_ARG=()
          if [ -n "${UI_RUNTIME_SERVICE_ACCOUNT}" ]; then
            UI_SA_ARG=(--service-account "${UI_RUNTIME_SERVICE_ACCOUNT}")
          fi
          BACKEND_URL="$(gcloud run services describe "${BACKEND_SERVICE}" --region "${REGION}" --format='value(status.url)')"
          BACKEND_ENDPOINT="${BACKEND_URL}/v1/deck/recommend"
          RESEARCH_ENDPOINT="${BACKEND_URL}/v1/research/run"
          CHAT_ENDPOINT="${BACKEND_URL}/v1/chat/respond"

          gcloud builds submit \
            --tag "${UI_IMAGE}" \
            -f Dockerfile.ui \
            .

          gcloud run deploy "${UI_SERVICE}" \
            --region "${REGION}" \
            --image "${UI_IMAGE}" \
            --allow-unauthenticated \
            "${UI_SA_ARG[@]}" \
            --set-env-vars "MTG_GCP_BACKEND_URL=${BACKEND_ENDPOINT},MTG_GCP_RESEARCH_URL=${RESEARCH_ENDPOINT},MTG_GCP_CHAT_URL=${CHAT_ENDPOINT}"

      - name: Setup Python for Agent Engine deployment
        if: ${{ inputs.deploy_agent_engine }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment dependencies
        if: ${{ inputs.deploy_agent_engine }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gcp.txt

      - name: Deploy Agent Engine app
        if: ${{ inputs.deploy_agent_engine }}
        run: |
          test -n "${STAGING_BUCKET}" || (echo "Missing repo variable GCP_STAGING_BUCKET" && exit 1)
          ARGS=""
          if [ "${{ inputs.langsmith_fanout }}" = "true" ]; then
            ARGS="--langsmith-fanout"
          fi
          python deploy_agent_engine.py \
            --project "${PROJECT_ID}" \
            --location "${REGION}" \
            --staging-bucket "gs://${STAGING_BUCKET}" \
            --display-name "${{ inputs.agent_display_name }}" \
            ${ARGS}

      - name: Print deployed service URLs
        run: |
          echo "Backend URL:"
          gcloud run services describe "${BACKEND_SERVICE}" --region "${REGION}" --format='value(status.url)' || true
          echo "UI URL:"
          gcloud run services describe "${UI_SERVICE}" --region "${REGION}" --format='value(status.url)' || true
