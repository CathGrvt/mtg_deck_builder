services:
  mtg-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 8080
      MTG_LOCAL_RETRIEVER_ENABLE_SEMANTIC: ${MTG_LOCAL_RETRIEVER_ENABLE_SEMANTIC:-false}
      MTG_BACKEND_MODE: ${MTG_BACKEND_MODE:-local}
      MTG_VERTEX_PROXY_RESEARCH: ${MTG_VERTEX_PROXY_RESEARCH:-false}
      MTG_VERTEX_PROXY_CHAT: ${MTG_VERTEX_PROXY_CHAT:-false}
      MTG_LLM_PROVIDER: ${MTG_LLM_PROVIDER:-openai}
      MTG_OPENAI_MODEL: ${MTG_OPENAI_MODEL:-gpt-4o-mini}
      MTG_OPENAI_API_KEY_SECRET_RESOURCE: ${MTG_OPENAI_API_KEY_SECRET_RESOURCE:-}
      MTG_VERTEX_MODEL: ${MTG_VERTEX_MODEL:-gemini-2.5-flash}
      MTG_RAG_CORPUS_URI: ${MTG_RAG_CORPUS_URI:-}
      MTG_VERTEX_AGENT_ENGINE_RESOURCE: ${MTG_VERTEX_AGENT_ENGINE_RESOURCE:-}
      MTG_VERTEX_FALLBACK_TO_LOCAL: ${MTG_VERTEX_FALLBACK_TO_LOCAL:-true}
      MTG_CHAT_ENABLE_CLARIFICATION: ${MTG_CHAT_ENABLE_CLARIFICATION:-true}
      MTG_CHAT_MAX_CLARIFICATION_TURNS: ${MTG_CHAT_MAX_CLARIFICATION_TURNS:-1}
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  mtg-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MTG_GCP_BACKEND_URL: ${MTG_COMPOSE_BACKEND_URL:-http://mtg-backend:8080/v1/deck/recommend}
      MTG_GCP_RESEARCH_URL: ${MTG_COMPOSE_RESEARCH_URL:-http://mtg-backend:8080/v1/research/run}
      MTG_GCP_CHAT_URL: ${MTG_COMPOSE_CHAT_URL:-http://mtg-backend:8080/v1/chat/respond}
    volumes:
      - ./:/app
    depends_on:
      mtg-backend:
        condition: service_healthy
